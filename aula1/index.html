<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestr.IA · Aula 1</title>
<meta name="description" content="Aula 1 da Maestr.IA.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --noite: #0B0807; --marfim: #F4EFEA; --cinza: #9A918B; --laranja: #FF8A3D; --vermelho: #E0402A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--noite); color: var(--marfim); font-family: 'Poppins', system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 56px 16px 40px;
         background: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,138,61,.13), transparent 70%), var(--noite); }
  .logo { width: min(560px, 86vw); height: auto; display: block; }
  .aviso { margin-top: 40px; text-align: center; max-width: 620px; }
  .selo { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px;
          border: 1px solid rgba(255,138,61,.45); background: rgba(255,138,61,.08);
          font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--laranja); }
  .selo i { width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); box-shadow: 0 0 0 0 rgba(255,138,61,.7); animation: pulso 1.8s infinite; }
  @keyframes pulso { 70% { box-shadow: 0 0 0 10px rgba(255,138,61,0); } 100% { box-shadow: 0 0 0 0 rgba(255,138,61,0); } }
  h1 { margin-top: 22px; font-size: clamp(26px, 4.6vw, 40px); font-weight: 600; line-height: 1.2; }
  p.sub { margin-top: 12px; font-size: clamp(15px, 2.2vw, 17px); font-weight: 300; color: var(--cinza); line-height: 1.6; }
  .player { margin-top: 44px; width: min(1100px, 100%); }
  .rot { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--cinza); margin-bottom: 12px; }
  video { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 14px; background: #000;
          box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
  footer { margin-top: auto; padding-top: 48px; font-size: 12px; color: #5E5650; letter-spacing: .06em; }
</style>
</head>
<body>
  <img class="logo" src="../logo.png" alt="Maestr.IA — Aprenda. Crie. Evolua." width="1400" height="343">

  <section class="aviso">
    <span class="selo"><i></i>Aula 1</span>
    <h1>A IA que trabalha por você</h1>
    <p class="sub">Aperte o play e assista com som.</p>
  </section>

  <section class="player">
    <div class="rot">Aula 1</div>
    <video id="v" controls playsinline preload="metadata" poster="poster.jpg"></video>
  </section>

  <footer>© 2026 Maestr.IA</footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    const v = document.getElementById('v'), src = 'video/aula1.m3u8';
    if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; }          // Safari / iPhone: HLS nativo
    else if (window.Hls && Hls.isSupported()) {
      const h = new Hls({ capLevelToPlayerSize: false, startLevel: -1 });
      h.loadSource(src); h.attachMedia(v);
    } else { v.src = src; }
  </script>
</body>
</html>
